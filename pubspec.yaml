name: prahar
description: A local-first study planner, scheduler and reminder app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Effort estimates and schedules are held in memory and persisted to a local
  # SQLite file. No network client here on purpose — the app has no server.
  sqflite: ^2.4.1
  path: ^1.9.0

  provider: ^6.1.2
  collection: ^1.18.0

  # On-device scheduled alarms. Requires core library desugaring in
  # android/app/build.gradle.kts — see CLAUDE.md.
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.0

  # No package for the battery-optimisation exemption. permission_handler was
  # tried and removed: it requires Android SDK 37, which installs as
  # "android-37.0" under Android's new minor-version scheme while Gradle looks
  # for "android-37" and fails outright. Two methods of Kotlin in
  # MainActivity.kt do the same job with no dependency and no SDK bump.

  # Removed: google_fonts fetches its files over HTTPS on first use, but the
  # release build has no INTERNET permission, so every fetch failed silently
  # and every "font" was the platform default. The picker's TTFs are bundled
  # under assets/fonts and referenced through the flutter.fonts entries below.

  # Only for the "open link" action on a topic. First-party package, minimal
  # surface, hands the URL to Android's own chooser rather than embedding a
  # webview — offline-first is preserved.
  url_launcher: '>=6.3.0 <7.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'

  # Runs real SQLite on the desktop VM so the DAO can be tested without a
  # device. Added after INSERT OR REPLACE was found to cascade-delete children;
  # database_test.dart guards against that returning.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  # Bundled variable fonts. Each TTF carries the whole weight range, so one
  # asset per family is enough for the four weights the theme uses (400 / 500
  # / 600 / 700). Files are fetched with tools\dev.ps1 fonts, from the
  # google/fonts repo.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: IBMPlexSerif
      fonts:
        - asset: assets/fonts/IBMPlexSerif.ttf
