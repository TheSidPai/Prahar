name: prahar
description: A local-first study planner, scheduler and reminder app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Effort estimates and schedules are held in memory and persisted to a local
  # SQLite file. No network client here on purpose — the app has no server.
  sqflite: ^2.4.1
  path: ^1.9.0

  provider: ^6.1.2
  collection: ^1.18.0

  # On-device scheduled alarms. Requires core library desugaring in
  # android/app/build.gradle.kts — see CLAUDE.md.
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.0

  # No package for the battery-optimisation exemption. permission_handler was
  # tried and removed: it requires Android SDK 37, which installs as
  # "android-37.0" under Android's new minor-version scheme while Gradle looks
  # for "android-37" and fails outright. Two methods of Kotlin in
  # MainActivity.kt do the same job with no dependency and no SDK bump.

  # Streams a family from fonts.google.com on first use and caches it. Pinned
  # tight to avoid another SDK-version surprise. The offline path is the
  # system default, so a failed fetch degrades cleanly rather than blanking
  # the app.
  google_fonts: '>=6.2.0 <7.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'

  # Runs real SQLite on the desktop VM so the DAO can be tested without a
  # device. Added after INSERT OR REPLACE was found to cascade-delete children;
  # database_test.dart guards against that returning.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
